name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate and refresh published Release
        if: github.event_name == 'release' && github.event.action != 'deleted'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/generate-download-history.mjs --require-tag "$RELEASE_TAG"

      - name: Refresh after deletion or manual request
        if: github.event.action == 'deleted' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-download-history.mjs

      - name: Save generated download history
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- src/data/downloadHistory.generated.json; then
            echo "Download history is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/downloadHistory.generated.json
          git commit -m "chore: refresh release download history"
          git push origin HEAD:main

      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
